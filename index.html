<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="styles.css">

  <script src="script.js" defer></script>
    <title>BOOK</title>

</head>
<body>
    <div class="header">My Library </div>
    <div id="library">My Library</div>
  <form id="book-form">
    <h3>Add Book</h3>
  <input id="title" placeholder="Title" required>
  <input id="author" placeholder="Author" required>
  <input id="pages" type="number" placeholder="Pages">
  <label>
    Read?
    <input id="read" type="checkbox">
  </label>
  <button type="submit">Add Book</button>
</form>

</body>
</html>
